# SSH Bağlantı Optimizasyonu Konfigürasyonu
# /etc/ssh/sshd_config dosyasına eklenecek ayarlar

# Bağlantı canlı tutma ayarları
ClientAliveInterval 60
ClientAliveCountMax 3

# TCP Keep-Alive etkinleştir
TCPKeepAlive yes

# Daha fazla eşzamanlı bağlantıya izin ver
MaxSessions 20
MaxStartups 20:30:100

# Bağlantı timeout'unu artır
LoginGraceTime 120

# Compression etkinleştir (ağ trafiğini azaltır)
Compression yes

# DNS lookup'ları devre dışı bırak (hızlandırır)
UseDNS no

# Authentication timeout'unu artır
AuthenticationMethods publickey,password